[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qg"
version = "0.1.0"
description = "Python bindings for RaBitQ QuantizedGraph"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.19.0",
    "pybind11>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[tool.setuptools]
packages = ["qg"]

[tool.setuptools.package-dir]
qg = "qg"

